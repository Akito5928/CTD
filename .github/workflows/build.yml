name: build

on:
  push:
    branches: [main, v1.2-rust]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release --locked --no-fail-fast
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ctd.exe dist/ctd-v1.2.1-windows-x86_64.exe
          ./dist/ctd-v1.2.1-windows-x86_64.exe version
      - uses: actions/upload-artifact@v4
        with:
          name: ctd-v1.2.1-windows-x86_64
          path: dist/ctd-v1.2.1-windows-x86_64.exe
      - name: Benchmark (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: cargo run --release --locked --example bench -- --sizes 1000,10000,100000 | Out-File -Encoding utf8 bench/results-windows.md
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bench-results-windows
          path: bench/results-windows.md

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release --locked --no-fail-fast
      - name: Build
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/ctd dist/ctd-v1.2.1-linux-x86_64
          ./dist/ctd-v1.2.1-linux-x86_64 version
      - uses: actions/upload-artifact@v4
        with:
          name: ctd-v1.2.1-linux-x86_64
          path: dist/ctd-v1.2.1-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ctd-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "CTD $GITHUB_REF_NAME" --generate-notes
