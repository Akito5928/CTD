[package]
name = "ctd"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "CTD - fast local full-text search for TXT files"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "ctd"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ctd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
